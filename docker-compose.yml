# Wayboo self-host: API, roteamento (Valhalla), busca (Photon) e mapa (PMTiles) a partir de um extrato OSM.
# Guia: docs/self-host.md. Configuração: copie .env.example para .env.
#
# Na primeira subida, os serviços de preparo (osm-extract, tiles-build, map-assets) baixam os dados e
# geram os tiles; depois disso a stack não chama serviço externo, exceto o clima (Open-Meteo, opcional).

name: wayboo

x-restart: &restart
  restart: unless-stopped

services:
  # ---------- preparo (rodam até terminar; numa nova subida, só refazem o que mudou) ----------

  osm-extract:
    image: alpine:3.22
    environment:
      OSM_EXTRACT_URL: ${OSM_EXTRACT_URL:-https://download.geofabrik.de/europe/andorra-latest.osm.pbf}
    volumes:
      - osm:/custom_files
    # Baixa de novo só se a URL mudar ou o .pbf for apagado. O .part evita deixar um extrato incompleto com o
    # nome final. A impressão digital (sha256 dos bytes) é a chave dos derivados: se mudar, apaga o grafo e o
    # banco de limites do Valhalla, cujo controle de mudança olha só o caminho do arquivo.
    command:
      - sh
      - -euc
      - |
        cd /custom_files
        if [ -f region.osm.pbf ] && [ "$$(cat region.url 2>/dev/null)" = "$$OSM_EXTRACT_URL" ]; then
          echo "Extrato já baixado: $$OSM_EXTRACT_URL"; exit 0
        fi
        echo "Baixando $$OSM_EXTRACT_URL"
        wget -q -O region.osm.pbf.part "$$OSM_EXTRACT_URL"
        new=$$(sha256sum region.osm.pbf.part | cut -d' ' -f1)
        if [ "$$new" != "$$(cat region.sha256 2>/dev/null)" ]; then
          echo "Extrato novo ($$new): o Valhalla refaz o grafo na próxima inicialização"
          rm -rf valhalla_tiles valhalla_tiles.tar admins.sqlite file_hashes.txt
        fi
        # Sem region.url, uma execução interrompida daqui em diante não passa pelo teste acima e baixa de novo.
        rm -f region.url
        mv region.osm.pbf.part region.osm.pbf
        printf '%s' "$$new" > region.sha256
        printf '%s' "$$OSM_EXTRACT_URL" > region.url

  tiles-build:
    image: ghcr.io/onthegomap/planetiler:0.10.2
    depends_on:
      osm-extract:
        condition: service_completed_successfully
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${PLANETILER_MEMORY:-2g}
    volumes:
      - osm:/osm:ro
      - tiles:/tiles
    # Gera o PMTiles (esquema OpenMapTiles) só se a impressão digital do extrato mudou. Grava em build/ e só
    # troca no fim: uma geração interrompida mantém o mapa anterior. --download busca água, lagos e Natural
    # Earth uma vez.
    entrypoint:
      - sh
      - -euc
      - |
        src=$$(cat /osm/region.sha256)
        if [ -f /tiles/region.pmtiles ] && [ "$$(cat /tiles/region.sha256 2>/dev/null)" = "$$src" ]; then
          echo "Tiles já gerados para o extrato $$src"; exit 0
        fi
        mkdir -p /tiles/build
        java -cp @/app/jib-classpath-file com.onthegomap.planetiler.Main \
          --osm-path=/osm/region.osm.pbf --output=/tiles/build/region.pmtiles --force \
          --download --download-dir=/tiles/sources --tmpdir=/tiles/tmp
        rm -rf /tiles/tmp
        # O osm-extract pode ter trocado o extrato durante a geração: aí o resultado não vale e o mapa anterior fica.
        if [ "$$(cat /osm/region.sha256)" != "$$src" ]; then
          echo "O extrato mudou durante a geração; rode de novo."; exit 1
        fi
        rm -f /tiles/region.sha256
        mv /tiles/build/region.pmtiles /tiles/region.pmtiles
        printf '%s' "$$src" > /tiles/region.sha256

  map-assets:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: wayboo-api
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - map:/srv/map
    command: ["/app/node_modules/.bin/tsx", "src/scripts/map-assets.ts"]

  # ---------- serviços ----------

  valhalla:
    <<: *restart
    image: ghcr.io/valhalla/valhalla-scripted:3.9.3
    depends_on:
      osm-extract:
        condition: service_completed_successfully
    # Usa o grafo existente. Quando o conteúdo do extrato muda, o osm-extract apaga o grafo e o Valhalla o
    # reconstrói ao iniciar (ver "Atualizar os dados" em docs/self-host.md).
    environment:
      server_threads: ${VALHALLA_THREADS:-2}
    volumes:
      - osm:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8002/status || exit 1"]
      interval: 30s
      timeout: 5s
      # A primeira subida constrói o grafo; num extrato estadual isso leva minutos.
      start_period: 30m

  photon:
    <<: *restart
    image: rtuszik/photon-docker:2.5.0
    environment:
      # Índice pronto por região. O Brasil só existe dentro de south-america (ver docs/self-host.md).
      REGION: ${PHOTON_REGION:-andorra}
      # Sem atualização automática: ela baixaria o índice de novo de um espelho externo.
      UPDATE_STRATEGY: DISABLED
      JAVA_PARAMS: -Xmx${PHOTON_MEMORY:-1g}
    volumes:
      - photon:/photon/data

  tiles:
    <<: *restart
    image: protomaps/go-pmtiles:v1.31.2
    depends_on:
      tiles-build:
        condition: service_completed_successfully
    command: ["serve", "/tiles", "--port=8080"]
    volumes:
      - tiles:/tiles:ro

  api:
    <<: *restart
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: wayboo-api
    depends_on:
      map-assets:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    # O .env leva as variáveis da API (IA, CORS etc.). As de baixo prevalecem: o gateway depende delas.
    environment:
      PORT: "8787"
      DB_PATH: /data/wayboo.db
      VALHALLA_URL: http://valhalla:8002
      PHOTON_URL: http://photon:2322
      MAP_STYLE_URL: ${PUBLIC_URL:-http://localhost:8080}/map/styles/light.json
      MAP_STYLE_DARK_URL: ${PUBLIC_URL:-http://localhost:8080}/map/styles/dark.json
      # A API não publica porta: na rede privada do compose só o gateway chega a ela, e o Caddy descarta o
      # X-Forwarded-For vindo do cliente. Assim o cabeçalho que ele repassa traz o IP real.
      TRUST_PROXY: uniquelocal
    # Faz host.docker.internal apontar para a máquina também no Docker Engine do Linux, que não cria esse nome
    # (requer Engine 20.10+). O Docker Desktop já o cria; aqui ele aponta para o mesmo IP do host. Serve para
    # um Ollama na máquina (ver "Ollama na mesma máquina" em docs/self-host.md).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - api:/data

  # Porta única para o app: API em /, tiles em /tiles, estilos, fontes e sprites em /map.
  # Com GATEWAY_ADDRESS igual a um domínio, o Caddy emite o certificado e serve HTTPS (ver docs/self-host.md).
  gateway:
    <<: *restart
    image: caddy:2.11.9-alpine
    depends_on:
      api:
        condition: service_healthy
      tiles:
        condition: service_started
    environment:
      GATEWAY_ADDRESS: ${GATEWAY_ADDRESS:-:80}
    ports:
      - ${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8080}:80
      - ${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_HTTPS_PORT:-8443}:443
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - map:/srv/map:ro
      - caddy:/data

volumes:
  osm:
  tiles:
  map:
  photon:
  api:
  caddy:
